{% extends 'base.html' %}

{% block title %}Página não encontrada - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="card card-brutalist p-5 max-w-700 mx-auto">
    <div class="display-1 font-heading text-warning fw-extrabold mb-3">404</div>
    <h1 class="font-heading fw-bold mb-3">Página Não Encontrada</h1>
    <p class="text-muted mb-4">O endereço solicitado não existe ou o imóvel foi removido pelo anunciante.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-vn-copper btn-lg">
      <i class="fa-solid fa-house me-2"></i> Voltar para a Página Inicial
    </a>
  </div>
</div>
{% endblock %}
